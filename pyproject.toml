[project]
name = "spotcse"
version = "0.1.0"
description = "Sentence embedding training and evaluation with SpotCSE"
readme = "README.md"
requires-python = ">=3.9,<3.10"
dependencies = [
    "datasets==1.18.4",
    "filelock>=3,<4",
    "huggingface-hub<0.11",
    "numpy>=1.21,<2",
    "packaging==21.3",
    "prettytable>=2,<4",
    "pyarrow==20.0.0",
    "scikit-learn>=1,<1.4",
    "scipy>=1.7,<1.14",
    "setuptools<81",
    "tensorboard>=2.7,<3",
    "torch==1.13.1",
    "tqdm>=4.49,<5",
    "transformers==4.3.3",
]

[tool.uv]
package = false
